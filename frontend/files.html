<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理 - 数据备份恢复工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>📦 备份工具</h2>
            </div>
            <div class="nav-menu">
                <a href="/dashboard.html" class="nav-item">
                    <span>📊</span> 仪表盘
                </a>
                <a href="/tasks.html" class="nav-item">
                    <span>📋</span> 备份任务
                </a>
                <a href="/files.html" class="nav-item active">
                    <span>📁</span> 文件管理
                </a>
                <a href="/logs.html" class="nav-item">
                    <span>📝</span> 操作日志
                </a>
                <a href="#" class="nav-item" onclick="logout()">
                    <span>🚪</span> 退出登录
                </a>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="page-header">
                <h1>文件管理</h1>
                <button class="btn btn-secondary" onclick="loadBackups()">🔄 刷新</button>
            </div>

            <!-- 文件列表 -->
            <div class="card">
                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>文件名</th>
                                <th>类型</th>
                                <th>大小</th>
                                <th>创建时间</th>
                                <th>MD5</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="file-list">
                            <tr>
                                <td colspan="6" class="empty-state">暂无文件</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 验证结果模态框 -->
    <div class="modal-overlay" id="verify-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>验证结果</h2>
                <button class="modal-close" onclick="closeVerifyModal()">&times;</button>
            </div>
            <div class="modal-body" id="verify-result">
                验证中...
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeVerifyModal()">确定</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // 检查登录状态
        checkAuth();

        // 加载文件列表
        loadBackups();

        async function loadBackups() {
            try {
                const backups = await apiGet('/backups');
                const tbody = document.getElementById('file-list');

                if (backups.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">暂无备份文件</td></tr>';
                    return;
                }

                tbody.innerHTML = backups.map(file => `
                    <tr>
                        <td><strong>${file.filename}</strong></td>
                        <td><span class="badge badge-info">${file.type || 'full'}</span></td>
                        <td>${file.size_human}</td>
                        <td>${new Date(file.created_at).toLocaleString()}</td>
                        <td style="font-family: monospace; font-size: 11px;">${file.checksum_md5 ? file.checksum_md5.substring(0, 12) + '...' : 'N/A'}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="downloadFile('${file.filename}')">下载</button>
                            <button class="btn btn-success btn-sm" onclick="verifyFile('${file.name || file.filename.replace('.tar.gz', '').replace('.zip', '')}')">验证</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteFile('${file.filename}')">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('加载文件失败:', error);
            }
        }

        function downloadFile(filename) {
            const token = localStorage.getItem('token');
            window.open(`/api/backups/download/${filename}?token=${token}`, '_blank');
        }

        async function verifyFile(backupName) {
            try {
                document.getElementById('verify-result').innerHTML = '<p>验证中...</p>';
                document.getElementById('verify-modal').classList.add('active');

                const result = await apiGet(`/backups/verify/${backupName}`);

                if (result.success) {
                    document.getElementById('verify-result').innerHTML = `
                        <div style="text-align: center;">
                            <p style="font-size: 48px; margin-bottom: 20px;">✅</p>
                            <h3 style="color: #22c55e; margin-bottom: 10px;">验证通过</h3>
                            <p style="color: #94a3b8;">${result.message}</p>
                            ${result.manifest ? `
                                <div style="margin-top: 20px; text-align: left; background: #0f172a; padding: 15px; border-radius: 8px;">
                                    <p><strong>文件数:</strong> ${result.manifest.file_count}</p>
                                    <p><strong>原始大小:</strong> ${formatSize(result.manifest.total_size)}</p>
                                    <p><strong>压缩大小:</strong> ${result.manifest.archive_size_human}</p>
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    document.getElementById('verify-result').innerHTML = `
                        <div style="text-align: center;">
                            <p style="font-size: 48px; margin-bottom: 20px;">❌</p>
                            <h3 style="color: #ef4444; margin-bottom: 10px;">验证失败</h3>
                            <p style="color: #94a3b8;">${result.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('verify-result').innerHTML = `
                    <div style="text-align: center;">
                        <p style="font-size: 48px; margin-bottom: 20px;">⚠️</p>
                        <h3 style="color: #f59e0b; margin-bottom: 10px;">验证出错</h3>
                        <p style="color: #94a3b8;">${error.message}</p>
                    </div>
                `;
            }
        }

        function closeVerifyModal() {
            document.getElementById('verify-modal').classList.remove('active');
        }

        async function deleteFile(filename) {
            if (!confirm(`确定要删除文件 "${filename}" 吗？此操作不可恢复！`)) return;

            try {
                await apiDelete(`/backups/${filename}`);
                alert('删除成功');
                loadBackups();
            } catch (error) {
                alert('删除失败: ' + error.message);
            }
        }

        function formatSize(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return bytes.toFixed(2) + ' ' + units[i];
        }
    </script>
</body>
</html>
